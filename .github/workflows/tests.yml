name: tests

on:
  push:
    branches:
      - main
  pull_request:

# One run per branch, and a newer commit cancels an unfinished older one.
#
# This repository is worked on in long sessions that land several commits in a row, and without this
# every one of them started a run that then ran to completion. Measured on 2026-10-15, five pushes in
# one session:
#
#     685e1af   46.5 min
#     6697149   55.2 min
#     2ced03c   63.2 min
#     5bb8f35   53.0 min
#
# 218 minutes of a finite free allowance, spent on four commits that were each superseded by the next
# within minutes.
#
# `cancel-in-progress` is the whole point. A cancelled run stops consuming the runner, so pushing five
# times in a row costs roughly the last run rather than the sum of all five.
#
# The group is keyed on the workflow and the ref, so a push to main cancels the previous push to main
# and leaves pull request runs alone. Keying it on the branch alone would cancel a pull request's run
# when the branch it targets moves, which is a different thing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Windows, and not Linux, which is the whole reason this file exists in this shape.
    #
    # Papyrus ships as a Windows executable. There is no Linux artifact, no Linux build, and no
    # Linux reader: the installer is Inno Setup, the runtime is frankenphp.exe against php.exe, the
    # entry point is a batch file, the packaged JRE is a Windows JRE, and the data directory is
    # `%LOCALAPPDATA%\Papyrus`. Every claim the packaging layer makes is a claim about Windows.
    #
    # Running it on Linux was worse than useless rather than merely incomplete. `ProcessFinder`
    # shells out to PowerShell, so every process-matching test found nothing and passed
    # vacuously. `PapyrusCmdTest` skips, because there is no `cmd.exe`. And four tests failed
    # outright, because they assert `%LOCALAPPDATA%` and a `C:` drive letter, which is the shape of
    # test that keeps the project honest on the only platform it has.
    #
    # So there were twenty-four consecutive red runs, every one of them a Linux runner failing to
    # be Windows. The fix is to run the tests on the platform they are about.
    #
    # This is deliberately one job and not a matrix. A Linux job with the Windows-only tests
    # excluded would be green and would mean nothing: it would cover the Laravel layer, which is
    # the part least likely to break, and skip the packaging layer, which is the part this project
    # has actually been getting wrong.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          # Named explicitly, and the reason is that Linux enables these by default and Windows does
          # not. The first Windows run failed before a single test executed: `composer install`
          # refused three locked packages because `ext-fileinfo` was absent, which is why
          # `league/flysystem` and `league/mime-type-detection` could not be installed.
          #
          # `fileinfo` is the one Composer actually names, and adding only it would be fixing the
          # error rather than the cause: a Windows runner simply has a smaller default set than a
          # Linux one, so the next runner image would produce the next missing extension. This list
          # is what the packaged runtime's own php.ini loads, which is the authoritative answer to
          # "what does this application need", and asking for those means CI and the shipped
          # artifact agree about what PHP is.
          extensions: fileinfo, mbstring, curl, gd, intl, zip, exif, sodium, pdo_sqlite, sqlite3, openssl

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # Major updates open separately. On 2026-11-05, a grouped major failed the
    # whole group and held back six routine updates with it.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # A major update opens on its own so one break cannot block routine updates.
    # PHPUnit 13 did exactly that on 2026-11-05.
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # Majors open separately: fontaine 1.0 conflicted with the plugin's peer
    # range and blocked the rest of the npm group on 2026-11-05.
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

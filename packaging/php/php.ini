; The php.ini a packaged Papyrus ships with.
;
; Templated at install time. Every `{{TOKEN}}` below is replaced by the installer with an
; absolute path inside the folder it chose. The file is in the repository with tokens intact so
; that the extension list is reviewable and changeable without unpacking a build, and so the
; next person does not re-derive it from a zip.
;
; ## Why this file exists at all
;
; FrankenPHP's Windows archive ships `php.ini-development` and `php.ini-production` and no
; working `php.ini`, on purpose. A static PHP with a permissive default ini is a worse thing to
; hand a reader than no PHP, so every packaged runtime brings its own.
;
; Verified on frankenphp.exe 1.13.2 with PHP 8.5.12, ZTS, which is the build FrankenPHP's
; Windows archive contains.
;
; ## Why these extensions and not the whole set
;
; Every one was found by grepping `app/` and `config/` for a call site, not by copying the
; distribution default:
;
;   pdo_sqlite   the database, which is SQLite and nothing else
;   sqlite3      same, for anything wanting the procedural driver
;   mbstring     24 call sites, the most used extension in this app
;   zip          15 call sites, every backup read and every CBZ written
;   gd           4 call sites, cover and page image work
;   fileinfo     mime detection on reader uploads
;   exif         orientation, because a phone photo is routinely rotated
;   curl         Guzzle, the extension store and the source fetches
;   openssl      HTTPS to the extension stores
;   intl         collation, and Laravel's locale handling
;   sodium       the encrypter's second choice and Laravel's default for app keys
;
; bcmath is deliberately absent because this build has it compiled in. `php -m` lists it with
; no ini at all. If a future build does not, it goes here, and the installer should check
; rather than assume.
;
; ## The two tokens that are not the same token
;
; `{{RUNTIME}}/ext` and `{{RUNTIME}}` are different destinations and conflating them is the
; first thing that will break. Pointing `extension_dir` at the runtime root loads nothing at
; all, and it fails as a wall of "the specified module could not be found" that never mentions
; a path.

extension_dir = "{{RUNTIME}}/ext"

extension=php_pdo_sqlite.dll
extension=php_sqlite3.dll
extension=php_mbstring.dll
extension=php_zip.dll
extension=php_gd.dll
extension=php_fileinfo.dll
extension=php_exif.dll
extension=php_curl.dll
extension=php_openssl.dll
extension=php_intl.dll
extension=php_sodium.dll

; ## Curl and certificates
;
; A bundled runtime has no system CA store it can rely on across every Windows image, and the
; extension store is fetched over HTTPS. Left unset, a clean machine gets "unable to get local
; issuer certificate", which reads like a network fault and is not one. The installer ships a
; cacert.pem and points this at it.

curl.cainfo = "{{RUNTIME}}/cacert.pem"

; ## Sizing
;
; A measured Tachimanga backup of one reader's library is 41MB, and a backup grows with the
; library it came from, so the old 64M ceiling was close enough to bind on a real file. 256M
; leaves room for a library several times that measured one. `post_max_size` must be the
; larger of the pair: if it is the smaller one, a large upload is silently truncated and the
; reader gets a confusing parse error instead of a clear rejection. The 4M between them is
; the multipart framing around the file.

memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 260M

; No wall clock. One reader on one machine, and an eleven minute backup import is a normal run.
; This is the same constraint the import work already had to work around against a FastCGI
; timeout, and setting it here means a packaged install does not rediscover it.

max_execution_time = 0

; Errors to the log, never to the response. A packaged app has no console, so a warning that
; would have been visible in development becomes invisible and then gets reported as "it just
; does not work".

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{LOGS}}/php-error.log"
error_reporting = E_ALL

; ## Execution hardening
;
; Defence in depth rather than a live hole. If a future path traversal, upload handler or
; template defect allows a file read or include, `allow_url_fopen` and an absent `open_basedir`
; turn a limited bug into arbitrary file disclosure or remote code execution. The application does
; not use remote stream wrappers, and every path it needs is one of these four roots.
;
; `{{APP_ROOT}}` is why this could not be a one line ini edit: the application code, `artisan` and
; `vendor` live above the runtime folder, so the launcher resolves the install root as well as the
; runtime, data directory and temp directory. The separator on Windows is `;`.
;
; `curl` stays enabled. The extension store and source fetches need it, and this setting is about
; local file access rather than the network.

allow_url_fopen = Off
allow_url_include = Off
open_basedir = "{{APP_ROOT}};{{RUNTIME}};{{DATA}};{{TEMP}}"

; ## Temp, and why it is inside the runtime
;
; Never the system temp. A packaged install is placed wherever the installer chose, and TEMP
; can have a very different lifetime and cleanup policy, which is how a half written file
; outlives the process that wrote it.
;
; The installer must create this directory. It will not do it for you, and the failure is not
; an obvious one: Symfony Process throws "a temporary file could not be opened" from whatever
; command first shells out, which during development reads as a bug in that command.

sys_temp_dir = "{{TEMP}}"
upload_tmp_dir = "{{TEMP}}"
session.save_path = "{{TEMP}}"

expose_php = Off
; The timezone PHP runs in, which the launcher also tells the JVM to use.
;
; It was UTC, and that was wrong, but not because UTC is the wrong zone. It was wrong because the
; JVM is started with no timezone flag and follows the machine, so on any machine not on UTC the
; two processes used different clocks. Papyrus logged "18:46:25 starting" while Suwayomi logged
; "13:46:29" for the same few seconds, and every Suwayomi timestamp in a diagnostics bundle was
; shifted by the reader's offset while looking perfectly precise.
;
; The fix is not to guess the machine's zone here. Windows reports it by display name,
; "SA Pacific Standard Time", which PHP does not accept and which would have made this file refuse
; to start. The launcher passes its own zone to the JVM instead, so the two agree by construction
; rather than by both guessing right.
;
; Nothing here sets a default: an unset date.timezone means PHP falls back to UTC, and the JVM
; would then be told to use UTC too, which is at least consistent and no longer a silent lie.
date.timezone = {{TIMEZONE}}

; ## Opcache
;
; `enable_cli` is off on purpose. The queue worker and the scheduler are long lived CLI
; processes that re-read changed files after a deploy, and an opcache that never notices a
; changed file makes an upgraded install behave like the old one.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; A packaged install is never rebuilt in place, it is swapped, so a long revalidate interval
; costs nothing and a short one is insurance against a stale file. Two seconds is cheap.